<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一服 — Digital Ritual</title><meta name="description" content="指を引いて、離す。煙の行方を眺める、小さな間。"><link rel="stylesheet" href="style.css?v=10"><body><header><span>一服</span><small>DIGITAL RITUAL</small><button id="reset" aria-label="煙を消す">リセット</button></header><main><div id="scene"><div class="pose" id="rest-pose"><img src="portrait-v7.png" alt="黒背景に浮かぶ成人女性の横顔"><div class="burn-mask"></div><div class="ember" id="ember"></div></div><div class="pose" id="inhale-pose" aria-hidden="true"><img src="inhale-v7.png" alt=""><div class="burn-mask"></div><div class="ember" id="ember-inhale"></div></div><canvas id="smoke"></canvas><div id="ending" role="status"><span>余韻</span><small>ひと息、つきました。</small></div></div></main><footer><p id="hint">ゆっくり引いて、指を離す。</p><button id="draw" aria-label="押してドラッグすると吸気、離すと煙が出ます。キーボードではスペースキーを長押し。"><span class="line"></span><span class="knob"></span><span class="label">引く</span></button><div class="pleasure"><span>満足感</span><div class="track"><i id="pleasure"></i></div><span id="level">0</span><span class="note">演出上のレベル</span></div></footer><script src="smoke.js?v=10"></script></body></html>
